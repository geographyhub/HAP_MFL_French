["les films d'horreur", "horror films"], ["les dessins animés", "cartoons"], ["les séries", "series"], ["les émissions de télé-réalité", "reality TV shows"], ["les documentaires", "documentaries"], ["Hier soir, j'ai regardé…", "Last night I watched…"], ["C'était passionnant", "It was exciting"], ["C'était nul", "It was rubbish"]]}, {"t": "Music and stars", "e": "🎤", "rows": [["Mon chanteur préféré, c'est…", "My favourite singer (man) is…"], ["Ma chanteuse préférée, c'est…", "My favourite singer (woman) is…"], ["J'écoute du rap", "I listen to rap"], ["Je le suis sur les réseaux sociaux", "I follow him on social media"], ["Je la trouve géniale", "I think she's great"], ["Il chante bien", "He sings well"]]}, {"t": "Role models and friends", "e": "⭐", "rows": [["Mon modèle, c'est…", "My role model is…"], ["Je l'admire parce que…", "I admire him / her because…"], ["Il est travailleur / Elle est travailleuse", "He / She is hard-working"], ["Il est courageux / Elle est courageuse", "He / She is brave"], ["Il aide les autres / Elle aide les autres", "He / She helps others"], ["Mon ami me soutient", "My friend supports me"], ["On s'entend bien", "We get on well"], ["On sort ensemble le week-end", "We go out together at the weekend"]]}, {"t": "Structures + infinitive", "e": "🔑", "rows": [["J'aime regarder des séries", "I like watching series"], ["J'adore écouter de la musique", "I love listening to music"], ["Je préfère lire", "I prefer reading"], ["On peut regarder des films", "You can watch films"], ["Il faut faire attention", "You have to be careful"], ["Je voudrais devenir acteur", "I would like to become an actor"], ["Je vais regarder un film", "I'm going to watch a film"]]}], "gram": [{"t": "Possessive adjectives", "p": "They match the <b>thing<\/b>, not the owner. <i>sa mère<\/i> can mean his mother or her mother.", "table": {"head": ["", "masculine", "feminine", "plural"], "rows": [["my", "mon", "ma", "mes"], ["your", "ton", "ta", "tes"], ["his / her", "son", "sa", "ses"], ["our", "notre", "notre", "nos"], ["your (all)", "votre", "votre", "vos"], ["their", "leur", "leur", "leurs"]]}}, {"t": "Structures + infinitive", "p": "After these, the next verb stays in the infinitive.", "table": {"head": ["Structure", "Meaning", "Example"], "rows": [["j'aime", "I like", "J'aime regarder des films."], ["on peut", "you can", "On peut télécharger des applis."], ["il faut", "you must", "Il faut faire attention."], ["je voudrais", "I would like", "Je voudrais devenir chanteur."]]}}, {"t": "The near future", "p": "<b>aller<\/b> + infinitive.", "table": {"head": ["", "aller", "example"], "rows": [["je", "vais", "je vais faire"], ["tu", "vas", "tu vas faire"], ["il / elle / on", "va", "il va faire"], ["(it)", "ça va", "ça va être génial"]]}}, {"t": "Direct object pronouns", "p": "<b>le<\/b> (him / it), <b>la<\/b> (her / it), <b>l'<\/b> (before a vowel), <b>les<\/b> (them). They go <b>before<\/b> the verb.", "ex": [["Je le suis.", "I follow him."], ["Je la trouve drôle.", "I find her funny."], ["Je l'admire.", "I admire him / her."], ["Je les regarde.", "I watch them."]], "tip": "In the perfect tense the pronoun goes before <i>avoir<\/i>: <i>Je l'ai vu.<\/i> (I saw it.)"}, {"t": "Present and perfect of -er verbs", "p": "Perfect = <b>avoir<\/b> + past participle (<b>-er → -é<\/b>).", "table": {"head": ["", "present: regarder", "perfect: regarder"], "rows": [["je", "regarde", "j'ai regardé"], ["tu", "regardes", "tu as regardé"], ["il / elle / on", "regarde", "il a regardé"], ["nous", "regardons", "nous avons regardé"], ["vous", "regardez", "vous avez regardé"], ["ils / elles", "regardent", "ils ont regardé"]]}, "tip": "Useful irregulars: <i>j'ai fait<\/i> (I did), <i>j'ai vu<\/i> (I saw), <i>j'ai eu<\/i> (I had), <i>je suis allé(e)<\/i> (I went)."}], "skills": [{"k": "h", "t": "Writing"}, {"k": "table", "head": ["Task", "Tier", "What to do"], "rows": [["Picture task", "Foundation only", "Write four short sentences about the photo."], ["Open response", "Foundation: 80 to 90 words. Higher: 130 to 150 words.", "Answer every bullet. Give opinions and reasons. Use present, past and future."], ["Translation", "Both", "English into French. Translate every word: each one can carry a mark."]]}, {"k": "model", "t": "Foundation picture task", "text": "Sur la photo, il y a deux garçons. Ils sont dans un parc. Ils jouent au foot. Il fait beau.", "en": "In the photo there are two boys. They are in a park. They are playing football. The weather is nice.", "notes": ["People", "Location", "Activity", "Weather"]}, {"k": "model", "t": "Open response: 80 to 90 words", "text": "J'adore les réseaux sociaux parce que je peux partager des photos avec mes amis. Tous les jours, je regarde des vidéos sur mon portable et j'écoute de la musique. Par contre, on peut perdre beaucoup de temps en ligne. Hier soir, j'ai regardé une série avec ma sœur et j'ai posté une photo de mon chat. Mon modèle, c'est ma mère : je l'admire parce qu'elle est travailleuse. Le week-end prochain, je vais aller au cinéma avec mes copains. Ça va être génial !", "en": "I love social media because I can share photos with my friends. Every day I watch videos on my phone and listen to music. On the other hand, you can waste a lot of time online. Last night I watched a series with my sister and posted a photo of my cat. My role model is my mum: I admire her because she is hard-working. Next weekend I'm going to go to the cinema with my mates. It's going to be great!", "notes": ["Present, perfect and near future", "Direct object pronoun: <i>je l'admire<\/i>", "Connective: <i>par contre<\/i>", "Opinion + reason"]}, {"k": "h", "t": "Translation practice"}, {"k": "p", "t": "Try each one in your head or on paper, then tap to check."}, {"k": "trans", "items": [["I watch films.", "Je regarde des films."], ["My sister is very funny.", "Ma sœur est très drôle."], ["Yesterday I watched a series.", "Hier, j'ai regardé une série."], ["You can download music.", "On peut télécharger de la musique."], ["Next weekend I am going to visit my grandparents.", "Le week-end prochain, je vais rendre visite à mes grands-parents."]]}, {"k": "p", "t": "<b>Tip:<\/b> <i>visiter<\/i> is for places. To visit <i>people<\/i>, use <i>rendre visite à<\/i>."}, {"k": "h", "t": "Speaking"}, {"k": "steps", "items": ["<b>Read aloud:<\/b> read slowly and clearly. Use the sounds table below: watch for silent endings. Then answer the two questions with an opinion and a reason.", "<b>Picture task:<\/b> describe the <b>people<\/b>, the <b>location<\/b> and the <b>activity<\/b>. Add an opinion: <i>ils ont l'air…, je pense que…<\/i>", "<b>Answer the questions<\/b> in full sentences and add a reason: <i>parce que…<\/i>"]}, {"k": "h", "t": "Dictation: the sounds of French"}, {"k": "p", "t": "In the Listening exam you write down French sentences you hear. These sound-spelling rules are what you need."}, {"k": "sounds", "rows": [["final consonants", "usually silent", "grand, petit, les"], ["-ent on a verb", "silent", "ils jouent"], ["ou", "\"oo\"", "rouge, nous"], ["u", "say \"ee\" with rounded lips", "tu, une"], ["oi", "\"wa\"", "moi, trois"], ["eau / au", "\"oh\"", "beau, au revoir"], ["é", "\"ay\"", "café, été"], ["è / ê", "\"eh\"", "mère, être"], ["ç", "\"s\"", "ça, français"], ["qu", "\"k\"", "quinze, qui"], ["an / en", "nasal \"on\", through your nose", "grand, enfant"], ["in / ain", "nasal \"an\"", "cinq, demain"], ["on", "nasal \"on\"", "bon, mon"], ["gn", "\"ny\", as in canyon", "Espagne, montagne"], ["h", "silent", "habiter, hôtel"]]}, {"k": "dict", "items": ["J'adore les réseaux sociaux.", "Hier soir, j'ai regardé une série.", "Mon modèle, c'est ma mère.", "On peut perdre du temps en ligne.", "Je vais télécharger une appli."]}], "quiz": [{"q": "What does <i>Je l'admire<\/i> mean?", "a": "I admire him / her", "w": ["I admire everything", "They admire me", "I admired him"], "why": "<i>l'<\/i> = le or la before a vowel; it goes before the verb."}, {"q": "\"I watched\" is…", "a": "j'ai regardé", "w": ["je regardé", "j'ai regarder", "je suis regardé"], "why": "<i>avoir<\/i> + past participle in -é."}, {"q": "In <i>sa mère<\/i> (his mother), why <i>sa<\/i>?", "a": "<i>mère<\/i> is feminine", "w": ["The owner is a girl", "It's plural", "<i>sa<\/i> only means \"his\""], "why": "Possessives match the thing, not the owner."}, {"q": "On peut ___ des films.", "a": "regarder", "w": ["regarde", "regardé", "regardons"], "why": "<i>on peut<\/i> + infinitive."}, {"q": "\"It's going to be…\" is…", "a": "ça va être", "w": ["ça va est", "ça être va", "c'est va être"], "why": "<i>va<\/i> + infinitive."}, {"q": "What does <i>C'était nul<\/i> mean?", "a": "It was rubbish", "w": ["It was zero", "It was new", "It was nice"], "why": "<i>nul<\/i> = rubbish; <i>passionnant<\/i> = exciting."}, {"q": "\"I follow her\" is…", "a": "Je la suis.", "w": ["Je suis la.", "Je la suivre.", "La je suis."], "why": "The pronoun goes before the verb."}, {"q": "What does <i>travailleuse<\/i> mean?", "a": "hard-working (feminine)", "w": ["travelling", "tiring", "worker (masculine)"], "why": "<i>travailleur<\/i> → <i>travailleuse<\/i>."}, {"q": "In the dictation you hear \"wa\". Which spelling is it?", "a": "oi", "w": ["oa", "wa", "ou"], "why": "<i>moi, trois, voiture<\/i>."}, {"q": "<i>jouer<\/i>: \"you (all) play\" is…", "a": "vous jouez", "w": ["vous jouons", "vous jouent", "vous joues"], "why": "vous → -ez."}, {"q": "Which sentence uses three timeframes?", "a": "Je regarde des séries, hier j'ai vu un film et demain je vais aller au cinéma.", "w": ["Je regarde des séries et j'aime ça.", "Hier, j'ai vu un film et j'ai mangé.", "Demain, je vais aller au cinéma et je vais manger."], "why": "Present, perfect and near future."}, {"q": "In the picture task, what must you describe?", "a": "People, location and activity", "w": ["Weather, clothes and colours", "Your family, school and town", "Your opinions only"], "why": "The Year 10 guide says: people, location and activity."}]}, "11": {"stage": "Edexcel GCSE · November mock", "examFacts": [["2 mock exams", "Speaking and Writing. Each is out of 50 marks."], ["2 tiers", "Foundation (grades 1 to 5) or Higher (grades 4 to 9). Check with your teacher which tier you are doing."], ["1 pen", "All you need to bring."]], "examNote": "The November mock: Speaking in individual slots, Writing on Wednesday 11 November 2026 (afternoon). Use this app to fix gaps before your GCSE.", "tables": [{"t": "Your mock papers", "head": ["", "Foundation (grades 1 to 5)", "Higher (grades 4 to 9)"], "rows": [["<b>Speaking<\/b>: 50 marks", "7 to 9 minutes", "10 to 12 minutes"], ["Task 1", "Read aloud (12 marks)", "Read aloud (12 marks)"], ["Task 2", "Role play (10 marks)", "Role play (10 marks)"], ["Task 3", "Picture task (12 marks) and conversation (16 marks)", "Picture task (12 marks) and conversation (16 marks)"], ["<b>Writing<\/b>: 50 marks", "1 hour 15 minutes", "1 hour 20 minutes"], ["Questions", "Photo description (8 marks)<br>40 to 50 words (14 marks)<br>80 to 90 words (18 marks)<br>Translation into French (10 marks)", "80 to 90 words (18 marks)<br>130 to 150 words (22 marks)<br>Translation into French (10 marks)"]]}, {"t": "Your GCSE in summer 2027: Pearson Edexcel French", "head": ["Paper", "What it tests", "Worth"], "rows": [["1 Speaking", "Read aloud, role play, picture task and conversation. 15 minutes to prepare first.", "25%"], ["2 Listening", "Questions in English, then a dictation: you write down French sentences you hear.", "25%"], ["3 Reading", "Questions in English, then a translation from French into English.", "25%"], ["4 Writing", "Open answers and a translation from English into French.", "25%"]]}], "topics": [{"h": "1. My personal world", "items": ["family, friends, relationships, equality"]}, {"h": "2. Lifestyle and wellbeing", "items": ["physical and mental wellbeing, food and drink, sports"]}, {"h": "3. My neighbourhood", "items": ["where I live, places in my area, activities and outings, shopping"]}, {"h": "4. Media and technology", "items": ["social media and gaming, hobbies, music, TV and film"]}, {"h": "5. Studying and my future", "items": ["school, future studies and jobs"]}, {"h": "6. Travel and tourism", "items": ["tourist attractions, accommodation, transport, shopping"]}], "topicsIntro": "The GCSE has six themes. Revise all six for your mock.", "prepare": ["Read through the tasks and questions in your exercise book.", "Missed a lesson? Ask your teacher or someone in your class what you missed and catch up.", "Check the Year 11 Languages resources in Student Essentials (on your school account), including the full walkthrough of the Speaking exam.", "Recommended book: the CGP <i>GCSE French Edexcel Complete Revision and Practice<\/i>.", "Learn the phrases for each theme in <a href=\"#rev\">Revision<\/a>, then test yourself in <a href=\"#flash\">Flashcards<\/a>."], "links": [["BBC Bitesize GCSE French", "https://www.bbc.co.uk/bitesize/examspecs/zhkvkhv"], ["Oak National Academy: Key Stage 4 French", "https://www.thenational.academy/teachers/programmes/french-secondary-ks4-l/units"], ["Pearson Edexcel GCSE French (specification, sample papers)", "https://qualifications.pearson.com/en/qualifications/edexcel-gcses/french-2024.html"]], "top": ["<b>Develop every answer:<\/b> opinion + reason + example + another timeframe.", "<b>Use all the tenses:<\/b> present, perfect, imperfect, near future, future and conditional (<i>je voudrais<\/i>).", "<b>Higher:<\/b> add a complex structure: <i>ce que j'aime le plus, c'est…; si j'avais…, je …-rais; quand je serai…; depuis…<\/i>", "<b>Answer every bullet point<\/b> in the writing tasks and keep near the word count.", "<b>Translation:<\/b> every word counts. Check tenses, agreements and accents."], "rev": [{"t": "1. My personal world", "e": "👪", "sub": "family, friends, relationships, equality", "rows": [["Je m'entends très bien avec ma mère parce qu'elle m'écoute toujours", "I get on very well with my mum because she always listens to me"], ["Je me dispute avec mon frère parce qu'il est très égoïste", "I argue with my brother because he is very selfish"], ["Un bon ami doit être fidèle et compréhensif", "A good friend should be loyal and understanding"], ["J'ai rencontré ma meilleure amie à l'école primaire", "I met my best friend at primary school"], ["Quand j'étais petit, je passais beaucoup de temps avec mes grands-parents", "When I was little, I spent lots of time with my grandparents"], ["À l'avenir, je voudrais me marier et avoir des enfants", "In the future I would like to get married and have children"], ["Je pense que tout le monde devrait avoir les mêmes droits", "I think everyone should have the same rights"], ["L'égalité entre les hommes et les femmes est très importante", "Equality between men and women is very important"], ["C'est injuste quand une personne est victime de discrimination", "It's unfair when someone suffers discrimination"]]}, {"t": "2. Lifestyle and wellbeing", "e": "🥗", "sub": "physical and mental wellbeing, food and drink, sports", "rows": [["Pour être en bonne santé, il faut manger des fruits et des légumes", "To be healthy, you have to eat fruit and vegetables"], ["Je fais du sport trois fois par semaine", "I do sport three times a week"], ["Hier, j'ai joué au foot et après je me suis senti très bien", "Yesterday I played football and afterwards I felt really good"], ["Je ne mange pas de fast-food parce que c'est trop gras", "I don't eat fast food because it's too fatty"], ["Je dors huit heures chaque nuit", "I sleep eight hours every night"], ["Quand je suis stressé, j'écoute de la musique ou je parle à un ami", "When I'm stressed, I listen to music or talk to a friend"], ["La santé mentale est aussi importante que la santé physique", "Mental health is as important as physical health"], ["Mon plat préféré, c'est le couscous parce que c'est délicieux", "My favourite dish is couscous because it's delicious"], ["Je vais boire plus d'eau et moins de boissons sucrées", "I'm going to drink more water and fewer sugary drinks"]]}, {"t": "3. My neighbourhood", "e": "🏘️", "sub": "where I live, places in my area, activities and outings, shopping", "rows": [["J'habite dans un quartier animé dans le sud-est de Londres", "I live in a lively area in south-east London"], ["Dans mon quartier, il y a beaucoup de magasins, mais il n'y a pas de cinéma", "In my area there are lots of shops, but there isn't a cinema"], ["Ce que j'aime le plus, c'est le parc parce que c'est calme", "What I like most is the park because it's quiet"], ["L'inconvénient, c'est qu'il y a beaucoup de circulation et de pollution", "The downside is that there's lots of traffic and pollution"], ["Samedi dernier, je suis allé au centre commercial", "Last Saturday I went to the shopping centre"], ["J'ai acheté un t-shirt, mais il était trop grand", "I bought a T-shirt, but it was too big"], ["On peut aller au cinéma ou manger au restaurant", "You can go to the cinema or eat at a restaurant"], ["Si j'avais de l'argent, je créerais un centre sportif", "If I had money, I would create a sports centre (Higher)"], ["Pour protéger l'environnement, il faut recycler", "To protect the environment, you have to recycle"]]}, {"t": "4. Media and technology", "e": "📱", "sub": "social media and gaming, hobbies, music, TV and film", "rows": [["J'utilise les réseaux sociaux pour rester en contact avec mes amis", "I use social media to stay in touch with my friends"], ["Je passe trop de temps sur mon portable", "I spend too much time on my phone"], ["J'adore les jeux vidéo, mais mes parents disent que c'est une perte de temps", "I love video games, but my parents say they're a waste of time"], ["Hier soir, j'ai vu un film d'action au cinéma", "Last night I saw an action film at the cinema"], ["Mon genre de musique préféré, c'est le rap", "My favourite kind of music is rap"], ["Il est important de ne pas partager ses données personnelles en ligne", "It's important not to share your personal data online"], ["Avant, je regardais beaucoup la télé, mais maintenant je préfère les séries en ligne", "I used to watch a lot of TV, but now I prefer online series"], ["Demain, je vais télécharger une nouvelle appli", "Tomorrow I'm going to download a new app"]]}, {"t": "5. Studying and my future", "e": "🎓", "sub": "school, future studies and jobs", "rows": [["Ma matière préférée, c'est l'histoire parce que le prof est très drôle", "My favourite subject is history because the teacher is really funny"], ["Les cours commencent à huit heures et demie", "Lessons start at half past eight"], ["Dans mon collège, il faut porter un uniforme", "In my school you have to wear a uniform"], ["L'année dernière, j'ai eu de bonnes notes en sciences", "Last year I got good marks in science"], ["Après mes examens, je vais continuer mes études", "After my exams, I'm going to carry on studying"], ["Je voudrais être médecin parce que je veux aider les gens", "I would like to be a doctor because I want to help people"], ["Parler une autre langue, c'est utile pour trouver un emploi", "Speaking another language is useful for finding a job"], ["Quand je serai plus âgé, je voyagerai partout dans le monde", "When I'm older, I will travel all over the world (Higher)"]]}, {"t": "6. Travel and tourism", "e": "✈️", "sub": "tourist attractions, accommodation, transport, shopping", "rows": [["D'habitude, je pars en vacances en France avec ma famille", "Usually I go on holiday to France with my family"], ["L'été dernier, nous sommes allés à la plage en avion", "Last summer we went to the beach by plane"], ["Nous avons logé dans un hôtel cinq étoiles", "We stayed in a five-star hotel"], ["J'ai visité beaucoup de monuments et j'ai pris beaucoup de photos", "I visited lots of monuments and took lots of photos"], ["Il faisait chaud et le ciel était bleu", "It was hot and the sky was blue"], ["Je préfère voyager en train parce que c'est plus confortable", "I prefer travelling by train because it's more comfortable"], ["L'année prochaine, je vais aller au Canada", "Next year I'm going to go to Canada"], ["Je voudrais loger dans un camping près de la mer", "I would like to stay at a campsite near the sea"], ["Je voudrais réserver une chambre double, s'il vous plaît", "I would like to book a double room, please"]]}], "cards": [{"t": "1. My personal world", "e": "👪", "rows": [["le copain / la copine", "friend, or boyfriend / girlfriend"], ["les parents", "parents"], ["se marier", "to get married"], ["se disputer", "to argue"], ["l'égalité", "equality"], ["les droits", "rights"], ["soutenir", "to support"], ["faire confiance à", "to trust"]]}, {"t": "2. Lifestyle and wellbeing", "e": "🥗", "rows": [["sain / saine", "healthy"], ["la malbouffe", "junk food"], ["le sommeil", "sleep"], ["stressé / stressée", "stressed"], ["en forme", "fit"], ["la santé", "health"], ["boire", "to drink"], ["les légumes", "vegetables"]]}, {"t": "3. My neighbourhood", "e": "🏘️", "rows": [["le quartier", "neighbourhood"], ["le magasin", "shop"], ["les vêtements", "clothes"], ["l'environnement", "the environment"], ["les déchets", "rubbish"], ["recycler", "to recycle"], ["bruyant / bruyante", "noisy"], ["bon marché", "cheap"]]}, {"t": "4. Media and technology", "e": "📱", "rows": [["les réseaux sociaux", "social media"], ["le portable", "mobile phone"], ["télécharger", "to download"], ["l'écran", "screen"], ["les jeux vidéo", "video games"], ["le film", "film"], ["partager", "to share"], ["l'appli", "app"]]}, {"t": "5. Studying and my future", "e": "🎓", "rows": [["la matière", "school subject"], ["le collège", "secondary school (11 to 15)"], ["les notes", "marks / grades"], ["le métier", "job / career"], ["la langue", "language"], ["réussir", "to succeed / to pass"], ["l'uniforme", "uniform"], ["l'université", "university"]]}, {"t": "6. Travel and tourism", "e": "✈️", "rows": [["le logement", "accommodation"], ["loger", "to stay (somewhere)"], ["le voyage", "journey / trip"], ["le billet", "ticket"], ["à l'étranger", "abroad"], ["réserver", "to book"], ["le souvenir", "souvenir"], ["la chambre", "room / bedroom"]]}], "gram": [{"t": "Present tense", "p": "What you normally do. Know your key irregulars.", "table": {"head": ["", "être", "avoir", "aller", "faire"], "rows": [["je / j'", "suis", "ai", "vais", "fais"], ["tu", "es", "as", "vas", "fais"], ["il / elle / on", "est", "a", "va", "fait"], ["nous", "sommes", "avons", "allons", "faisons"], ["ils / elles", "sont", "ont", "vont", "font"]]}}, {"t": "Perfect tense: what you did", "p": "<b>avoir<\/b> or <b>être<\/b> + past participle. Most verbs use <i>avoir<\/i>.", "table": {"head": ["with avoir", "with être (add -e for a girl, -s for plural)"], "rows": [["j'ai mangé (I ate)", "je suis allé(e) (I went)"], ["j'ai fait (I did)", "je suis arrivé(e) (I arrived)"], ["j'ai vu (I saw)", "je suis resté(e) (I stayed)"], ["j'ai pris (I took)", "nous sommes partis (we left)"]]}, "tip": "Reflexive verbs use <i>être<\/i> too: <i>je me suis senti(e)<\/i> (I felt)."}, {"t": "Imperfect: used to / was", "p": "nous form, drop -ons, add <i>-ais, -ais, -ait, -ions, -iez, -aient<\/i>. <i>être<\/i> → <i>ét-<\/i>. Foundation needs the singular forms (je, tu, il / elle); Higher needs them all.", "ex": [["Quand j'étais petit, je jouais au foot.", "When I was little, I used to play football."], ["Il faisait chaud.", "It was hot."]]}, {"t": "Future", "p": "Both tiers: the near future, <i>je vais<\/i> + infinitive. <b>Higher only:<\/b> the simple future of -er verbs (infinitive + <i>-ai, -as, -a, -ons, -ez, -ont<\/i>) and the singular of the irregulars below.", "table": {"head": ["Infinitive", "I will…"], "rows": [["voyager", "je voyagerai"], ["être", "je serai"], ["avoir", "j'aurai"], ["aller", "j'irai"], ["faire", "je ferai"]]}}, {"t": "Conditional: would", "p": "Both tiers: <i>je voudrais<\/i>. <b>Higher only:<\/b> -er verbs and the singular of key irregulars (future stem + <i>-ais, -ais, -ait…<\/i>).", "ex": [["Je voudrais être professeur.", "I would like to be a teacher."], ["Ce serait génial.", "It would be great."], ["J'aimerais voyager.", "I would like to travel."]]}, {"t": "Higher: impressive structures", "p": "The present subjunctive and the pluperfect are <b>not<\/b> needed for this GCSE. Use these instead.", "table": {"head": ["Structure", "Example", "English"], "rows": [["si + imperfect → conditional", "Si j'avais de l'argent, je <b>voyagerais<\/b>.", "If I had money, I would travel."], ["quand + future", "Quand je <b>serai<\/b> plus âgé, je travaillerai à l'étranger.", "When I'm older, I'll work abroad."], ["depuis + present", "J'apprends le français <b>depuis<\/b> quatre ans.", "I have been learning French for four years."], ["passive with par (present)", "Le festival <b>est organisé par<\/b> la ville.", "The festival is organised by the town."]]}}], "skills": [{"k": "h", "t": "Speaking: 15 minutes to prepare, then three tasks"}, {"k": "p", "t": "You get 15 minutes to prepare, with one A4 sheet for notes. No dictionary."}, {"k": "h3", "t": "Task 1: Read aloud (12 marks)"}, {"k": "p", "t": "Read a short text (Foundation 35 to 40 words; Higher 50 to 55 words), then answer two questions in the present tense about your likes, dislikes or opinions."}, {"k": "model", "t": "Practise reading this aloud", "text": "J'aime beaucoup mon quartier. Il y a un grand parc et beaucoup de magasins. Le samedi, je vais en ville avec mes amis. D'habitude, on mange dans un petit restaurant. Ma sœur préfère aller au cinéma.", "en": "I really like my area. There is a big park and lots of shops. On Saturdays I go into town with my friends. We usually eat in a small restaurant. My sister prefers going to the cinema."}, {"k": "model", "t": "Then answer the questions", "text": "Tu aimes ton quartier ? Oui, j'aime mon quartier parce que c'est animé et il y a beaucoup de choses à faire. Qu'est-ce que tu fais le week-end ? Le week-end, je fais du sport et je retrouve mes amis en ville.", "en": "Do you like your area? Yes, I like my area because it's lively and there are lots of things to do. What do you do at the weekend? At the weekend I do sport and meet my friends in town."}, {"k": "h3", "t": "Task 2: Role play (10 marks)"}, {"k": "p", "t": "Five bullet points. Foundation: you ask one question (marked ?). Higher: you ask two questions, and one answer needs the future."}, {"k": "table", "head": ["Bullet", "You say"], "rows": [["Setting: you are at a hotel in France.", ""], ["Say how many nights", "Je voudrais une chambre pour trois nuits."], ["Say what type of room", "Une chambre double, s'il vous plaît."], ["Say what you want to do in town", "Je veux visiter le musée."], ["? Ask the price", "C'est combien ?"], ["Say what you will do tomorrow (Higher)", "Demain, je vais aller à la plage."]]}, {"k": "h3", "t": "Task 3: Picture task (12 marks) and conversation (16 marks)"}, {"k": "p", "t": "Describe the picture: <b>people, location, activity<\/b>. Then two questions: Foundation both in the present; Higher one present, one past. Then a conversation on your chosen theme."}, {"k": "model", "t": "Model picture description (Higher)", "text": "Sur la photo, il y a une famille dans un parc. À gauche, il y a un homme qui porte un t-shirt bleu et à droite, deux enfants jouent au foot. Il fait beau et ils ont l'air contents. Je pense que c'est le week-end parce qu'ils sont détendus.", "en": "In the photo there is a family in a park. On the left there is a man wearing a blue T-shirt and on the right two children are playing football. The weather is nice and they look happy. I think it's the weekend because they are relaxed."}, {"k": "model", "t": "Model answers to the two questions", "text": "Tu aimes faire du sport en famille ? Oui, j'adore ça parce que c'est amusant et ça nous garde en forme. Qu'est-ce que tu as fait le week-end dernier ? Samedi dernier, je suis allé au parc avec mes cousins et on a joué au basket. Ensuite, on a mangé une pizza.", "en": "Do you like doing sport with your family? Yes, I love it because it's fun and it keeps us fit. What did you do last weekend? Last Saturday I went to the park with my cousins and we played basketball. Then we ate a pizza."}, {"k": "steps", "items": ["<b>Conversation:<\/b> give long answers. Opinion + reason + example + a different tense.", "Use phrases that buy thinking time: <i>Alors…, Euh, bonne question…, Voyons…<\/i>", "If you don't understand, ask: <i>Vous pouvez répéter, s'il vous plaît ?<\/i>"]}, {"k": "h", "t": "Writing"}, {"k": "model", "t": "Foundation 40 to 50 words: formal email to a hotel", "text": "Monsieur, Madame, Je voudrais réserver une chambre double pour deux nuits en août. J'aimerais une chambre avec vue sur la mer. Est-ce qu'il y a une piscine à l'hôtel ? Le petit-déjeuner coûte combien ? Nous allons arriver le cinq août. Cordialement, Sam Smith", "en": "Dear Sir or Madam, I would like to book a double room for two nights in August. I would like a room with a sea view. Is there a pool at the hotel? How much does breakfast cost? We are going to arrive on the fifth of August. Kind regards, Sam Smith"}, {"k": "model", "t": "Foundation and Higher 80 to 90 words: email to a friend", "text": "Salut Lucas ! L'été dernier, je suis allé à Barcelone avec ma famille. On a logé dans un hôtel près de la plage. On a visité la Sagrada Família et on a mangé de la paella dans un restaurant. C'était fantastique ! D'habitude, je préfère aller à la plage parce que j'adore nager et bronzer. L'année prochaine, je vais aller en Italie en train avec mes amis. Je voudrais visiter Rome parce que je veux voir le Colisée. Et toi ? Où vas-tu aller ? À bientôt, Sam", "en": "Hi Lucas! Last summer I went to Barcelona with my family. We stayed in a hotel near the beach. We visited the Sagrada Família and ate paella in a restaurant. It was fantastic! I usually prefer going to the beach because I love swimming and sunbathing. Next year I'm going to go to Italy by train with my friends. I'd like to visit Rome because I want to see the Colosseum. And you? Where are you going to go? See you soon, Sam", "notes": ["Perfect: <i>je suis allé, on a logé, on a visité<\/i>", "Imperfect: <i>c'était<\/i>", "Near future and conditional", "A question back to the reader"]}, {"k": "model", "t": "Higher 130 to 150 words: article on healthy living", "text": "La santé est très importante pour les jeunes aujourd'hui. À mon avis, pour être en forme, il faut bien manger, dormir huit heures et faire du sport régulièrement. Personnellement, je joue au basket deux fois par semaine et je vais au collège à pied. Pourtant, ce n'était pas toujours le cas. Quand j'étais plus jeune, je mangeais beaucoup de malbouffe et je passais des heures devant les écrans. L'année dernière, j'ai décidé de changer mes habitudes : j'ai commencé à boire plus d'eau et j'ai arrêté les boissons sucrées. Je me suis senti beaucoup mieux et j'avais plus d'énergie en classe. De plus, la santé mentale est aussi importante que la santé physique. C'est pourquoi j'essaie de parler à mes amis quand je suis stressé. À l'avenir, je voudrais courir un semi-marathon. Si tout le monde fait de petits changements, la société sera plus saine.", "en": "Health is very important for young people today. In my opinion, to be fit you have to eat well, sleep eight hours and do sport regularly. Personally, I play basketball twice a week and I walk to school. However, it wasn't always like that. When I was younger, I used to eat lots of junk food and spend hours in front of screens. Last year I decided to change my habits: I started drinking more water and stopped sugary drinks. I felt much better and had more energy in class. Also, mental health is as important as physical health. That's why I try to talk to my friends when I'm stressed. In the future I'd like to run a half marathon. If everyone makes small changes, society will be healthier.", "notes": ["Imperfect and perfect side by side", "<i>Je me suis senti<\/i>: a reflexive in the perfect", "Comparison: <i>aussi importante que<\/i>", "Conditional, future and a <i>si<\/i> clause"]}, {"k": "h", "t": "Translation practice: English into French"}, {"k": "trans", "items": [["I get on well with my parents.", "Je m'entends bien avec mes parents."], ["Last summer we went to Spain by plane.", "L'été dernier, nous sommes allés en Espagne en avion."], ["When I was younger, I used to play football every day.", "Quand j'étais plus jeune, je jouais au foot tous les jours."], ["In the future I would like to be a doctor.", "À l'avenir, je voudrais être médecin."], ["It is important to eat healthily.", "Il est important de manger sainement."]]}, {"k": "h", "t": "Dictation: the sounds of French"}, {"k": "p", "t": "Section B of the Listening paper is a dictation. Learn these sound-spelling rules, then practise."}, {"k": "sounds", "rows": [["final consonants", "usually silent", "grand, petit, les"], ["-ent on a verb", "silent", "ils jouent"], ["ou", "\"oo\"", "rouge, nous"], ["u", "say \"ee\" with rounded lips", "tu, une"], ["oi", "\"wa\"", "moi, trois"], ["eau / au", "\"oh\"", "beau, au revoir"], ["é", "\"ay\"", "café, été"], ["è / ê", "\"eh\"", "mère, être"], ["ç", "\"s\"", "ça, français"], ["qu", "\"k\"", "quinze, qui"], ["an / en", "nasal \"on\", through your nose", "grand, enfant"], ["in / ain", "nasal \"an\"", "cinq, demain"], ["on", "nasal \"on\"", "bon, mon"], ["gn", "\"ny\", as in canyon", "Espagne, montagne"], ["h", "silent", "habiter, hôtel"]]}, {"k": "dict", "items": ["J'aime aller au cinéma avec mes amis.", "L'année dernière, nous sommes allés à la plage.", "Il faut recycler le plastique.", "Mon frère veut être journaliste.", "La cuisine française est délicieuse."]}], "quiz": [{"q": "Which tense is <i>nous sommes allés<\/i>?", "a": "Perfect (past)", "w": ["Imperfect", "Present", "Conditional"], "why": "<i>être<\/i> + past participle: <i>aller<\/i> is an <i>être<\/i> verb."}, {"q": "\"I would like to be a doctor\" is…", "a": "Je voudrais être médecin.", "w": ["Je veux être médecin.", "J'ai voulu être médecin.", "Je vais être médecin."], "why": "<i>je voudrais<\/i> = I would like (conditional)."}, {"q": "<i>Quand je serai plus âgé…<\/i> What is <i>serai<\/i>?", "a": "The future of <i>être<\/i>", "w": ["The present of <i>être<\/i>", "The perfect of <i>être<\/i>", "The imperfect of <i>être<\/i>"], "why": "After <i>quand<\/i> about the future, French uses the future tense."}, {"q": "\"I felt\" (a boy speaking) is…", "a": "je me suis senti", "w": ["j'ai senti", "je suis senti", "je me sentais"], "why": "Reflexive verbs take <i>être<\/i> in the perfect."}, {"q": "What does <i>Nous avons logé dans un hôtel<\/i> mean?", "a": "We stayed in a hotel", "w": ["We booked a hotel", "We left the hotel", "We liked the hotel"], "why": "<i>loger<\/i> = to stay (accommodation)."}, {"q": "<i>aller<\/i> in the future: \"I will go\" is…", "a": "j'irai", "w": ["j'allerai", "je vais", "je suis allé"], "why": "Irregular future stem: <i>ir-<\/i>."}, {"q": "Which phrase means \"What I like most is…\"?", "a": "Ce que j'aime le plus, c'est…", "w": ["L'avantage, c'est que…", "Je voudrais…", "J'aime plus que…"], "why": "A great complex structure for speaking and writing."}, {"q": "In the role play, what does <b>?<\/b> on a bullet mean?", "a": "You must ask a question", "w": ["You don't need to answer", "Answer in the past", "The teacher asks you"], "why": "Foundation has one question to ask; Higher has two."}, {"q": "What does <i>l'égalité<\/i> mean?", "a": "Equality", "w": ["Equal", "The same", "Identity"], "why": "Theme 1: My personal world."}, {"q": "<i>Si j'avais de l'argent, je ___ un centre sportif.<\/i>", "a": "créerais", "w": ["crée", "créerai", "créais"], "why": "<i>si<\/i> + imperfect → conditional (Higher)."}, {"q": "How long do you get to prepare for the speaking exam?", "a": "15 minutes", "w": ["5 minutes", "30 minutes", "No preparation"], "why": "You can make notes on one A4 sheet."}, {"q": "Which means \"I spend too much time on my phone\"?", "a": "Je passe trop de temps sur mon portable.", "w": ["Je dépense trop d'argent sur mon portable.", "J'ai trop de portables.", "Je passe mon portable à mes amis."], "why": "<i>passer du temps<\/i> = to spend time; <i>dépenser<\/i> = to spend money."}]}}, "vocab": {"subjects": ["Family", "Friends", "Relationships", "Equality", "Physical wellbeing", "Mental wellbeing", "Food and drink", "Sports", "Places in town", "Shopping", "Transport", "The natural world", "Environmental issues", "Social media and gaming", "Music", "TV and film", "School", "Future opportunities", "Accommodation", "Tourist attractions", "General and grammatical", "Cultural and geographical"], "emo": ["👪", "🤝", "💞", "⚖️", "🏃", "🧠", "🍽️", "⚽", "🏙️", "🛍️", "🚆", "🌳", "♻️", "🎮", "🎵", "🎬", "🏫", "💼", "🏨", "🗺️", "🔤", "🌍"], "words": [["la, l' (f)", "the", "det", 0, [20]], ["le, l' (m)", "the", "det", 0, [20]], ["les (pl)", "the", "det", 0, [20]], ["la, l' (f)", "her, it (obj)", "pron", 0, [20]], ["le, l' (m)", "him, it (obj)", "pron", 0, [20]], ["les", "them (m, f) (obj)", "pron", 1, [20]], ["de la, de l' (f)", "some (of the) (f)", "det", 0, [20]], ["de, d'", "indefinite article following a verb in negative or expression of quantity, partitive article following a verb in negative or expression of quantity", "det", 0, [20]], ["des (pl)", "plural indefinite article, some (of the)", "det", 0, [20]], ["du, de l' (m)", "some (of the) (m)", "det", 0, [20]], ["de la/de l'", "of the, from (the) (f)", "prep", 0, [20]], ["de/d'", "of, from", "prep", 0, [20]], ["des", "of the, from (the) (pl)", "prep", 0, [20]], ["du/de l'", "of the, from (the) (m)", "prep", 0, [20]], ["un (m)", "a, an", "det", 0, [20]], ["une (f)", "a, an", "det", 0, [20]], ["un", "one", "num", 0, [20]], ["à", "at, to, in, on", "prep", 0, [20]], ["à la/à l'", "at the, to the, in the, on the (f)", "prep", 0, [20]], ["au/à l'", "at the, to the, in the, on the (m)", "prep", 0, [20]], ["aux", "at the, to the, in the, on the  lot of rubbish in the street. It's horrible. Léa: I'm Léa. At home I always recycle plastic and paper. Karim: My name is Karim. In my town there are too many cars, so I go to school by bike.", "qs": [{"k": "mcq", "q": "(a) Hugo says there is a lot of …", "o": ["rubbish.", "traffic.", "noise."], "a": 0}, {"k": "mcq", "q": "(b) Léa always recycles …", "o": ["glass and cans.", "plastic and paper.", "clothes."], "a": 1}, {"k": "mcq", "q": "(c) Karim goes to school by …", "o": ["bus.", "car.", "bike."], "a": 2}]}, {"sec": "listen", "tier": "F", "t": "My phone", "intro": "Chloé is talking about how she uses her phone. Which three things does she do? Choose three.", "audio": ["J'utilise mon portable tous les jours. Le matin, j'écoute de la musique dans le bus. À la récré, j'envoie des messages à mes amis. Le soir, je regarde des vidéos de cuisine, mais je ne joue jamais aux jeux vidéo parce que je n'aime pas ça."], "en": "I use my phone every day. In the morning I listen to music on the bus. At break I send messages to my friends. In the evening I watch cooking videos, but I never play video games because I don't like them.", "qs": [{"k": "multi", "q": "What does Chloé do on her phone?", "o": ["listens to music", "plays video games", "sends messages", "takes photos", "watches cooking videos", "reads the news"], "a": [0, 2, 4]}]}, {"sec": "listen", "tier": "H", "t": "Sport and health", "intro": "Inès is talking about sport. Answer the questions in English.", "audio": ["Je joue au basket dans une équipe du quartier depuis deux ans. Avant, je ne faisais pas de sport et je passais des heures devant les écrans. Maintenant, je me sens beaucoup mieux et je dors bien. Le mois dernier, je me suis blessée à la jambe, alors je n'ai pas pu jouer pendant trois semaines. C'était très frustrant. L'année prochaine, je voudrais devenir capitaine de l'équipe."], "en": "I have been playing basketball in a local team for two years. Before, I didn't do any sport and I spent hours in front of screens. Now I feel much better and I sleep well. Last month I hurt my leg, so I couldn't play for three weeks. It was very frustrating. Next year I would like to become the team captain.", "qs": [{"k": "short", "q": "(a) How long has Inès played basketball?", "a": "Two years."}, {"k": "short", "q": "(b) What did she do before? Give one detail.", "a": "She did no sport, or she spent hours in front of screens."}, {"k": "short", "q": "(c) Give one benefit of sport she mentions.", "a": "She feels much better, or she sleeps well."}, {"k": "short", "q": "(d) Why couldn't she play last month?", "a": "She hurt her leg."}, {"k": "short", "q": "(e) What would she like to do next year?", "a": "Become the team captain."}]}, {"sec": "listen", "tier": "H", "t": "Holidays", "intro": "Théo is talking about holidays. Put a cross in the correct box for each question.", "audio": ["L'été dernier, nous sommes allés dans un camping dans le nord de la France. Le meilleur, c'était le paysage, mais il a plu presque tous les jours. Cette année, je préfère rester à la maison avec mes amis, parce que voyager coûte très cher."], "en": "Last summer we went to a campsite in the north of France. The best thing was the scenery, but it rained almost every day. This year I prefer to stay at home with my friends, because travelling costs a lot.", "qs": [{"k": "mcq", "q": "(a) Last summer Théo stayed in …", "o": ["a hotel.", "a campsite.", "a friend's house."], "a": 1}, {"k": "mcq", "q": "(b) The problem was …", "o": ["the weather.", "the food.", "the journey."], "a": 0}, {"k": "mcq", "q": "(c) This year he prefers to stay at home because …", "o": ["his friends are away.", "he has exams.", "travelling is expensive."], "a": 2}]}, {"sec": "read", "tier": "F", "t": "Manon's weekend", "intro": "Read what Manon says. Put a cross in the correct box for each question.", "text": "Salut ! Je m'appelle Manon et j'habite à Marseille. Le samedi matin, je vais au marché avec ma grand-mère. L'après-midi, je retrouve mes amis au parc. Le dimanche, je fais mes devoirs et le soir, je regarde une série avec ma famille. Le week-end prochain, je vais aller à la plage parce qu'il va faire chaud.", "qs": [{"k": "mcq", "q": "(a) On Saturday mornings Manon goes to the …", "o": ["market.", "cinema.", "sports centre."], "a": 0}, {"k": "mcq", "q": "(b) On Saturday afternoons she …", "o": ["does her homework.", "meets friends in the park.", "visits her grandmother."], "a": 1}, {"k": "mcq", "q": "(c) On Sunday evenings she …", "o": ["goes to bed early.", "plays video games.", "watches a series with her family."], "a": 2}, {"k": "mcq", "q": "(d) Next weekend she is going to the beach because …", "o": ["it's her birthday.", "it is going to be hot.", "her cousins are there."], "a": 1}]}, {"sec": "read", "tier": "F", "t": "My school", "intro": "Read the text. Complete each sentence with a word from the box. There are more words than gaps.", "text": "Mon collège est grand et moderne. Ma matière préférée, c'est le dessin parce que le prof est très drôle. Je n'aime pas les maths parce que c'est difficile. Je porte un uniforme, mais ça ne me dérange pas. À midi, je mange à la cantine avec mes amis.", "qs": [{"k": "gaps", "q": "Complete the sentences.", "box": ["art", "difficult", "canteen", "music", "boring", "park"], "items": [["(a) Their favourite subject is", "art"], ["(b) They find maths", "difficult"], ["(c) At lunchtime they eat in the", "canteen"]]}]}, {"sec": "read", "tier": "H", "t": "Young people and social media", "intro": "Read the article. Answer the questions in English.", "text": "Beaucoup de gens pensent que les jeunes passent trop de temps sur les réseaux sociaux. Selon un sondage récent, soixante-dix pour cent des adolescents français utilisent leur portable plus de trois heures par jour. Pour certains, les réseaux sont un moyen de s'exprimer et de rencontrer des personnes qui ont les mêmes intérêts. Cependant, d'autres disent qu'ils se sentent tristes quand ils comparent leur vie à celle des autres. Les experts conseillent d'éteindre son portable une heure avant de dormir.", "qs": [{"k": "short", "q": "(a) What percentage of French teenagers use their phone for more than three hours a day?", "a": "70%."}, {"k": "short", "q": "(b) Give one positive thing about social media mentioned.", "a": "A way to express yourself, or to meet people with the same interests."}, {"k": "short", "q": "(c) Why do some young people feel sad?", "a": "They compare their life with other people's."}, {"k": "short", "q": "(d) What do experts advise?", "a": "Switching off your phone an hour before going to sleep."}]}, {"sec": "trans", "tier": "F", "t": "Translate into English: five sentences", "intro": "Write your English, then tap each one to check.", "items": [["J'ai un frère aîné.", "I have an older brother."], ["J'aime aller au cinéma le vendredi.", "I like going to the cinema on Fridays."], ["Ma mère travaille dans un hôpital.", "My mum works in a hospital."], ["Hier, j'ai mangé du poisson avec ma famille.", "Yesterday I ate fish with my family."], ["Demain, je vais rendre visite à mes grands-parents.", "Tomorrow I'm going to visit my grandparents."]]}, {"sec": "trans", "tier": "H", "t": "Translate into English: a short paragraph", "intro": "Write your English, then tap to check.", "items": [["Quand j'étais petite, j'habitais dans un village près de la montagne. J'adorais jouer dans la rivière avec mes cousins. Il y a trois ans, ma famille a déménagé à Paris parce que mon père a trouvé du travail là-bas. Maintenant, j'ai plus d'occasions, mais la nature me manque.", "When I was little, I lived in a village near the mountains. I loved playing in the river with my cousins. Three years ago my family moved to Paris because my dad found work there. Now I have more opportunities, but I miss nature."]]}], "marking": [["Listening and Reading", "You answer in English. There are <b>no marks for the quality of your English<\/b>, so keep answers short and clear. Answer exac    return '<h3>'+n+'</h3><div class="pgx">'+its.map(function(r){var ic=D.icons[r[3]];return '<div>'+(ic?'<span class="hi-i"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">'+ic+'</svg></span>':'<span></span>')+'<p style="margin:0"><b class="pgw">'+r[1]+'</b><span class="pge">'+r[2]+'</span>'+sayBtn(r[1])+'</p></div>';}).join('')+'</div>';}).join('');
  document.getElementById('pgl').innerHTML=html||'<p class="lead">No matches.</p>';
  [].forEach.call(document.querySelectorAll('#pgsets button'),function(b){b.onclick=function(){PG.set=b.dataset.s;draw();};});}
 var tm;document.getElementById('pgq').oninput=function(){var v=this.value;clearTimeout(tm);tm=setTimeout(function(){PG.q=v.trim();draw();},150);};
 draw();
}

var p=parse();go(p.y,p.t,true);
})();
