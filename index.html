<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2357">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HAP French">
<title>French · Years 7 to 11 · Harris Academy Peckham</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#0A2357;--main:#1F4BB0;--pale:#E5ECFA;--line:#D0DBF2;--accent:#E1000F;--gold:#F4B740;--ink:#1B2A3A;--ink2:#4A5563;--paper:#FAF8F4;--good:#2E7D32;--bad:#B3261E}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:20px;line-height:1.45;padding-bottom:84px}
a{color:var(--main);font-weight:700}
header{background:var(--deep);color:#fff;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.mast{max-width:1000px;margin:0 auto;padding:24px 20px 20px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:'Archivo',Arial,sans-serif;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75);font-size:15px}
h1{font-family:'Archivo','Arial Black',Arial,sans-serif;font-weight:900;font-size:clamp(42px,9vw,72px);line-height:1;margin:8px 0 6px}
h1 span{color:var(--gold)}
.sub{font-size:clamp(19px,2.6vw,22px);color:rgba(255,255,255,.88)}
.logo{background:#fff;border-radius:12px;padding:8px 12px;flex:none}.logo img{display:block;height:46px;width:auto}
.years{max-width:1000px;margin:0 auto;padding:0 20px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.years .lab{font-weight:800;font-size:18px;color:rgba(255,255,255,.8);margin-right:4px}
.years button{font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:20px;min-width:58px;padding:10px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.years button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--deep)}
nav.tabs{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .in{max-width:1000px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap}
nav.tabs button{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:18px;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:9px 16px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--main);border-color:var(--main);color:#fff}
@media(max-width:560px){nav.tabs .in{gap:6px;padding:8px 10px}nav.tabs button{font-size:16px;padding:7px 11px}.mast{flex-direction:column-reverse;padding:16px 16px 12px}.mast .logo img{height:38px}.years{padding:0 16px 14px;flex-wrap:nowrap;gap:8px}.years .lab{display:none}.years button{flex:1;min-width:0;padding:9px 4px}}
main{max-width:1000px;margin:0 auto;padding:22px 20px 40px}
h2{font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:clamp(28px,5vw,38px);color:var(--deep);margin:32px 0 12px;line-height:1.1}
h3{font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:24px;color:var(--deep);margin:22px 0 8px}
.tag{display:inline-block;background:var(--main);color:#fff;font-weight:800;border-radius:999px;padding:6px 16px;font-size:16px;letter-spacing:.06em}
.lead{font-size:20px;margin-bottom:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.facts{grid-template-columns:1fr 1fr}}@media(max-width:480px){.facts{grid-template-columns:1fr}}
.fact{background:var(--pale);border-radius:18px;padding:16px 18px}
.fact b{display:block;font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:30px;color:var(--main);line-height:1.1;margin-bottom:4px}
.note{background:#FFF6DF;border-left:6px solid #E8A33D;border-radius:12px;padding:14px 18px;margin:16px 0;font-size:20px}
.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:700px){.blocks{grid-template-columns:1fr}}
.blk{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px}
.blk h3{margin:0 0 6px}.blk ul{padding-left:24px}.blk li{margin:5px 0}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:14px 16px 14px 72px;background:#fff;border:2px solid var(--line);border-radius:16px;margin-bottom:10px}
ol.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:44px;height:44px;border-radius:12px;background:var(--main);color:#fff;font:900 22px 'Archivo',Arial,sans-serif;display:flex;align-items:center;justify-content:center}
ol.steps.top li::before{background:#E8A33D}
.links li{margin:8px 0}.links{padding-left:24px}
.tblw{overflow-x:auto;margin:10px 0 16px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:19px}
th{background:var(--main);color:#fff;text-align:left;padding:11px 14px}td{padding:11px 14px;border-top:2px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--paper)}
@media(max-width:560px){table.stk thead{display:none}table.stk,table.stk tbody,table.stk tr,table.stk td{display:block;width:100%}table.stk tr{border-top:3px solid var(--main);padding:6px 0}table.stk td{border-top:none;padding:5px 14px}table.stk td:empty{display:none}table.stk td[data-label]:not([data-label=""])::before{content:attr(data-label);display:block;font-size:15px;font-weight:800;color:var(--main);text-transform:uppercase;letter-spacing:.04em}tr:nth-child(even) td{background:#fff}}
.soon{margin-top:24px;background:#fff;border:2px dashed var(--line);border-radius:18px;padding:16px 20px;color:var(--ink2)}
/* revision */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 16px}
.tog{font:800 18px 'Nunito Sans',Arial,sans-serif;border:2px solid var(--main);background:#fff;color:var(--deep);border-radius:999px;padding:9px 18px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--main);color:#fff}
.topic{background:#fff;border:2px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}
.topic summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:14px;padding:14px 18px;font:900 23px 'Archivo',Arial,sans-serif;color:var(--deep)}
.topic summary::-webkit-details-marker{display:none}
.topic summary .em{font-size:34px;line-height:1}
.topic summary .sub2{display:block;font:700 16px 'Nunito Sans',Arial,sans-serif;color:var(--ink2)}
.topic summary::after{content:'+';margin-left:auto;font-size:30px;color:var(--main)}
.topic[open] summary::after{content:'–'}
.ph{width:100%;border-collapse:collapse}
.ph td{border-top:2px solid var(--line);padding:10px 12px;vertical-align:middle}
.ph td.t{font-weight:800;color:var(--deep);width:52%}
.ph td.s{width:56px;padding:6px}
.cover .ph td.en{color:transparent;background:repeating-linear-gradient(135deg,var(--pale) 0 8px,#fff 8px 16px)!important;cursor:pointer;border-radius:0}
.cover .ph td.en.show{color:var(--ink);background:#fff!important}
@media(max-width:600px){.ph td{display:block;width:auto!important;border-top:none;padding:4px 14px}.ph tr{display:grid;grid-template-columns:1fr 52px;border-top:2px solid var(--line);padding:8px 0}.ph td.t{grid-column:1}.ph td.s{grid-column:2;grid-row:1 / span 2;align-self:center}.ph td.en{grid-column:1}}
.say{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--pale);font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say:active{transform:scale(.94)}
/* grammar */
.gp{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.gp h3{margin-top:0}
.ex{display:grid;gap:8px;margin-top:10px}
.ex div{display:flex;gap:12px;align-items:center;background:var(--pale);border-radius:12px;padding:10px 12px}
.ex b{color:var(--deep)}.ex span{color:var(--ink2);display:block;font-size:18px}
.tip{margin-top:12px;background:#FFF6DF;border-left:6px solid #E8A33D;border-radius:10px;padding:10px 14px;font-size:19px}
/* skills */
.model{background:#fff;border:2px solid var(--main);border-radius:18px;padding:16px 18px;margin:14px 0}
.model h3{margin:0 0 8px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.model .tx{font-size:21px;line-height:1.55;color:var(--deep);font-weight:700}
.model details{margin-top:10px}.model summary{cursor:pointer;font-weight:800;color:var(--main)}
.model .en{margin-top:8px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips span{background:var(--pale);color:var(--deep);border-radius:10px;padding:6px 12px;font-size:17px;font-weight:700}
.tr{display:grid;gap:10px}
.tr button{text-align:left;font:700 20px 'Nunito Sans',Arial,sans-serif;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;color:var(--ink)}
.tr button i{display:block;font-style:normal;color:var(--main);font-weight:800;margin-top:4px;visibility:hidden}
.tr button.show i{visibility:visible}
.tr button small{display:block;font-size:15px;color:var(--ink2);font-weight:700}
.dict{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.dq{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dq input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;flex:1 1 220px;min-width:0}
.dq .chk{font:800 18px 'Archivo',Arial,sans-serif;background:var(--main);color:#fff;border:none;border-radius:12px;padding:12px 18px;cursor:pointer}
.dq .res{flex-basis:100%;font-size:19px;font-weight:700}.dq .res:empty{display:none}
.dq .res.ok{color:var(--good)}.dq .res.no{color:var(--bad)}
.dq .num{font:900 22px 'Archivo',Arial,sans-serif;color:var(--main);min-width:22px}
.voicenote{font-size:17px;color:var(--ink2);margin-top:8px}
/* GCSE word list */
.hb{display:inline-block;background:#E8A33D;color:#fff;font:900 13px 'Archivo',Arial,sans-serif;border-radius:6px;padding:2px 6px;vertical-align:2px}
.vsearch{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin:4px 0 12px;background:#fff}
#vl .topic{margin-bottom:14px}
/* exam practice */
.ep{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px}
.ep h3{margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tb{display:inline-block;font:900 14px 'Archivo',Arial,sans-serif;border-radius:8px;padding:3px 9px;color:#fff;background:var(--main)}.tb.H{background:#E8A33D}
.plays{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.plays .big{font-size:19px;padding:12px 18px}
.passage{background:var(--pale);border-radius:14px;padding:14px 16px;font-size:21px;line-height:1.55;color:var(--deep);font-weight:700;margin:10px 0}
.pq{margin-top:14px}.pq .qt{font-weight:800;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;font:700 19px 'Nunito Sans',Arial,sans-serif;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.opts button b{display:inline-block;width:30px;color:var(--main)}
.opts button[aria-pressed="true"]{border-color:var(--deep);background:var(--pale)}
.opts button.right{background:#E3F2E4;border-color:var(--good)}.opts button.wrong{background:#FBE4E2;border-color:var(--bad)}
.fbk{font-weight:800;margin-top:6px;min-height:0}.fbk.ok{color:var(--good)}.fbk.no{color:var(--bad)}
.sa textarea,.tx2 textarea{width:100%;font:inherit;font-size:19px;border:2px solid var(--line);border-radius:12px;padding:10px;min-height:56px}
.ans2{display:none;background:#E3F2E4;border-radius:10px;padding:8px 12px;margin-top:6px;font-weight:700}.ans2.show{display:block}
.small2{font:800 17px 'Archivo',Arial,sans-serif;background:#fff;color:var(--deep);border:2px solid var(--main);border-radius:12px;padding:9px 14px;cursor:pointer;margin-top:8px}
.gapl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.gapl select{font:inherit;font-size:19px;padding:6px 10px;border-radius:10px;border:2px solid var(--line)}
.boxw{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.boxw span{border:2px dashed var(--main);border-radius:10px;padding:4px 12px;font-weight:800}
.mk{display:grid;gap:12px}.mk div{background:var(--pale);border-radius:14px;padding:14px 16px}.mk b.h{display:block;font:900 21px 'Archivo',Arial,sans-serif;color:var(--deep);margin-bottom:4px}
/* flashcards: same Leitner boxes as the other Peckham Hub apps */
:root{--card:#fff}
.fc{position:relative;height:300px;border:none;background:none;width:100%;padding:0}
.fc .face{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;backface-visibility:hidden;transition:transform .5s;border:2px solid var(--line);text-align:center}
.fc .front{background:var(--ink);color:var(--paper)}
.fc .front b{font-family:'Fredoka';font-size:clamp(30px,5vw,42px)}
.fc .back{background:var(--card);transform:rotateY(180deg);font-size:22px}
.fc.flip .front{transform:rotateY(180deg)} .fc.flip .back{transform:rotateY(360deg)}
.fc small{font-size:16px;opacity:.8;margin-top:12px}
@media (prefers-reduced-motion:reduce){.fc .face{transition:none}}
/* Leitner flashcards */
.lt{max-width:820px}
.lt-top{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.lt-stat{flex:1 1 150px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.lt-stat b{display:block;font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:34px;line-height:1.1;color:var(--ink)}
.lt-stat span{font-size:16px;color:var(--ink2);font-weight:700}
.lt-xp{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.lt-xp i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .5s}
.lt-boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 0 18px}
.lt-boxes{padding-top:8px}
.lt-box{position:relative;height:150px;color:#fff;text-align:center}
.lt-box.b1{--c:#B3261E;--top:#D9574F;--in:#5E120E}.lt-box.b2{--c:#C0631A;--top:#E38A45;--in:#663209}
.lt-box.b3{--c:#B08A00;--top:#D9B23A;--in:#5C4800}.lt-box.b4{--c:#1F7A9C;--top:#4FA6C6;--in:#0C3B4D}.lt-box.b5{--c:#2E7D32;--top:#5DAA61;--in:#123F15}
.lt-box .lid{position:absolute;left:0;right:0;top:0;height:34px;background:var(--top);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}
.lt-box .lid::after{content:'';position:absolute;left:9%;right:9%;top:5px;bottom:4px;background:var(--in);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.lt-box .stack{position:absolute;left:0;right:0;top:-6px;height:40px;z-index:1;pointer-events:none}
.lt-box .stack i{position:absolute;left:50%;bottom:0;width:48%;height:36px;margin-left:-24%;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.35);border-top:4px solid var(--top)}
.lt-box .stack i:nth-child(1){transform:translateX(-14%) rotate(-9deg)}.lt-box .stack i:nth-child(2){transform:translateX(12%) rotate(7deg)}.lt-box .stack i:nth-child(3){transform:translateY(-6px)}
.lt-box .front{position:absolute;left:0;right:0;top:32px;bottom:0;z-index:2;border-radius:3px 3px 14px 14px;padding:10px 4px 8px;display:flex;flex-direction:column;justify-content:flex-end;
 background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 14%,rgba(255,255,255,.08) 50%,rgba(0,0,0,0) 86%,rgba(0,0,0,.25)),var(--c);
 box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -10px 0 rgba(0,0,0,.2),0 8px 0 -2px rgba(0,0,0,.18),0 12px 16px rgba(0,0,0,.22)}
.lt-box .n{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:38px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lt-box .l{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:19px;margin-top:4px}
.lt-box .w{font-size:14px;font-weight:700;opacity:.95;margin-top:2px;line-height:1.2}
.lt-box.pulse{animation:ltpulse .6s}
@keyframes ltpulse{40%{transform:translateY(-6px) scale(1.06)}}
.lt-burst{position:absolute;left:50%;top:14px;width:0;height:0;z-index:5;pointer-events:none}
.lt-burst i{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:ltconf 1s cubic-bezier(.2,.7,.4,1) forwards}
.lt-burst i.r{width:10px;height:10px;border-radius:50%}
@keyframes ltconf{0%{opacity:1;transform:translate(0,0) rotate(0)}65%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r))}100%{opacity:0;transform:translate(calc(var(--x)*1.15),calc(var(--y) + 46px)) rotate(calc(var(--r)*1.6))}}
@media(max-width:560px){.lt-boxes{gap:6px}.lt-box{height:136px}.lt-box .lid{height:28px}.lt-box .front{top:26px;border-radius:3px 3px 10px 10px;padding:8px 2px 7px}.lt-box .n{font-size:30px}.lt-box .l{font-size:16px}.lt-box .w{font-size:12px}.lt-box .stack i{height:28px}}
@media (prefers-reduced-motion:reduce){.lt-box.pulse,.lt-burst i{animation:none}}
.lt-big{font-size:21px;padding:14px 22px}
.lt-msg{font-size:20px;margin:6px 0 14px}
.lt-run .qhead{display:flex;justify-content:space-between;font-weight:700;font-size:18px;color:var(--ink2);margin-bottom:6px}
.lt-run .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.lt-run .bar i{display:block;height:100%;background:var(--main);transition:width .3s}
.lt-tag{display:inline-block;font-weight:800;font-size:15px;color:#fff;border-radius:99px;padding:4px 12px;margin-bottom:8px}
.lt-run .fc{height:320px}
.lt-run .fc .back{font-size:24px;line-height:1.35}
.lt-ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lt-ans button{border:none;border-radius:16px;padding:18px 10px;font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:24px;color:#fff;cursor:pointer}
.lt-ans .no{background:var(--bad)}.lt-ans .yes{background:var(--good)}
.lt-ans button:disabled{opacity:.35;cursor:default}
.lt-hint{font-size:18px;color:var(--ink2);text-align:center;margin-top:10px;min-height:26px;font-weight:700}
.lt-pop{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:22px;text-align:center;margin-top:10px;min-height:30px}
.lt-pop.up{color:var(--good)}.lt-pop.down{color:var(--bad)}
.lt-end .score{font-size:64px}
.lt-list{display:grid;gap:8px;margin-top:12px}
.lt-list div{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:18px}
.lt-how{margin-top:18px}
.lt-how summary{cursor:pointer;font-weight:800;font-size:19px}
.lt-how p{font-size:18px;margin-top:8px}
.lt{max-width:820px}
.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 20px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{font-family:'Archivo',Arial,sans-serif;font-weight:800;border:none;border-radius:14px;background:var(--main);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--deep);border:2px solid var(--main)}
.fc .front{background:var(--deep)!important;color:#fff!important}
.fc .back{color:var(--deep)}
body:has(.lt-run) .phub{display:none}
.lt-say{display:flex;justify-content:center;margin-top:10px}
.decks{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.decks button{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:18px;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:14px;padding:10px 16px;cursor:pointer}
.decks button[aria-pressed="true"]{background:var(--pale);border-color:var(--main)}
.decks small{font-weight:700;opacity:.75}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chipset button{font:800 17px 'Nunito Sans',Arial,sans-serif;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:8px 14px;cursor:pointer}
.chipset button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.big{font:900 22px 'Archivo',Arial,sans-serif;border:none;border-radius:16px;background:var(--main);color:#fff;padding:16px 26px;cursor:pointer}
.big.alt{background:#fff;color:var(--deep);border:2px solid var(--main)}
.run .qhead{display:flex;justify-content:space-between;font-weight:800;font-size:18px;color:var(--ink2);margin-bottom:6px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .4s}
.endscore{font:900 60px 'Archivo',Arial,sans-serif;color:var(--main)}
.how{margin-top:18px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px}.how summary{cursor:pointer;font-weight:800}.how p{margin-top:8px;font-size:19px}
/* picture glossary: same layout as the other Peckham Hub apps */
.pgsearch{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;font-size:19px;margin:6px 0 12px;box-sizing:border-box}
.pgsets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pgsets button{font-weight:800;font-size:17px;border:2px solid var(--line);background:#fff;color:var(--deep,#102A43);border-radius:999px;padding:8px 16px;cursor:pointer}
.pgsets button[aria-pressed="true"]{background:var(--deep,#102A43);color:#fff;border-color:var(--deep,#102A43)}
.pgl h3{margin:20px 0 10px;font-size:23px}
.pgx{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.pgx>div{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;line-height:1.4;color:#102A43}
.hi-i{display:block;width:128px;height:128px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px;box-sizing:border-box}
.hi-i svg{width:100%;height:100%;display:block}
.pgx .pgw{display:block;font-size:24px;margin-bottom:4px}
@media (max-width:480px){.pgx>div{grid-template-columns:96px 1fr;gap:12px}.hi-i{width:96px;height:96px}}
.pgx .pge{display:block;color:var(--ink2);font-size:18px}.pgx .say{width:40px;height:40px;margin-top:6px}
/* quiz */
.qcard{background:#fff;border-radius:18px;padding:18px;border:2px solid var(--line)}
.qq{font:800 23px 'Nunito Sans',Arial,sans-serif;margin-bottom:14px}
.qopts{display:grid;gap:10px}
.qopts button{text-align:left;font:700 20px 'Nunito Sans',Arial,sans-serif;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;color:var(--ink)}
.qopts button b{display:inline-block;width:34px;color:var(--main)}
.qopts button.right{background:#E3F2E4;border-color:var(--good)}.qopts button.wrong{background:#FBE4E2;border-color:var(--bad)}
.qfb{margin-top:14px;font-size:20px}.qfb strong{display:block;font-size:22px}
.phub{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;background:#102A43;color:#F4B740;font:800 18px/1 'Archivo',Arial,sans-serif;padding:13px 18px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35);border:2px solid #F4B740}
body.running .phub{display:none}
footer{max-width:1000px;margin:0 auto;padding:0 20px 30px;font-size:16px;color:var(--ink2)}
@media print{nav.tabs,.years,.phub,.say{display:none!important}body{background:#fff}}
</style>

ou (all) have"], ["ils / elles", "ont", "they have"]]}, "ex": [["J'ai les cheveux courts.", "I have short hair."], ["Mon frère a treize ans.", "My brother is 13."]]}, {"t": "my, your, his, her", "p": "The word for \"my\" matches the <b>thing<\/b>: masculine, feminine or plural.", "table": {"head": ["", "masculine", "feminine", "plural"], "rows": [["my", "mon", "ma", "mes"], ["your", "ton", "ta", "tes"], ["his / her", "son", "sa", "ses"]]}, "ex": [["mon père", "my father"], ["ma sœur", "my sister"], ["mes grands-parents", "my grandparents"]], "tip": "Before a feminine word starting with a vowel, use <b>mon<\/b>: <i>mon amie<\/i>."}, {"t": "Adjective agreement", "p": "Add <b>-e<\/b> for feminine and <b>-s<\/b> for plural. Most adjectives go <b>after<\/b> the noun.", "table": {"head": ["masculine", "feminine", "plural"], "rows": [["grand", "grande", "grands / grandes"], ["petit", "petite", "petits / petites"], ["timide", "timide", "timides"], ["paresseux", "paresseuse", "paresseux / paresseuses"], ["marron", "marron", "marron"]]}, "ex": [["les yeux bleus", "blue eyes"], ["une petite sœur", "a little sister"]], "tip": "<i>grand<\/i> and <i>petit<\/i> go <b>before<\/b> the noun. <i>marron<\/i> never changes."}, {"t": "Negatives", "p": "Put <b>ne … pas<\/b> around the verb. <i>ne<\/i> becomes <i>n'<\/i> before a vowel. After a negative, <i>un / une / des<\/i> become <b>de<\/b>.", "ex": [["Je ne suis pas timide.", "I am not shy."], ["Je n'ai pas de sœur.", "I don't have a sister."]]}, {"t": "Use the question to build your answer", "p": "Change <b>tu<\/b> to <b>je<\/b>, and <b>ton / ta<\/b> to <b>mon / ma<\/b>.", "table": {"head": ["Question", "Answer"], "rows": [["Comment tu t'appelles ?", "Je m'appelle…"], ["Tu as quel âge ?", "J'ai … ans."], ["Tu es comment ?", "Je suis…"], ["Tu as des frères et sœurs ?", "J'ai… / Je n'ai pas de frères et sœurs."], ["C'est quand, ton anniversaire ?", "C'est le…"]]}}], "skills": [{"k": "h", "t": "Your speaking or writing task"}, {"k": "p", "t": "You will do one of these: your teacher will tell you which. Either way, you introduce yourself, describe your appearance and personality, and talk about your family."}, {"k": "model", "t": "Model answer", "text": "Salut ! Je m'appelle Sam et j'ai douze ans. Mon anniversaire, c'est le cinq mai. Je suis assez grand et j'ai les cheveux noirs et courts. J'ai les yeux marron. Je suis sympa et très drôle, mais quelquefois je suis paresseux. Dans ma famille, il y a quatre personnes : ma mère, mon père, ma sœur et moi. Ma sœur s'appelle Léa. Elle est petite et elle a les cheveux longs. Elle est intelligente, mais elle n'est pas bavarde. Je m'entends bien avec ma sœur parce qu'elle est sympa.", "en": "Hi! My name is Sam and I am 12. My birthday is the 5th of May. I am quite tall and I have short black hair. I have brown eyes. I am nice and very funny, but sometimes I am lazy. There are four people in my family: my mum, my dad, my sister and me. My sister is called Léa. She is short and she has long hair. She is clever, but she isn't chatty. I get on well with my sister because she is nice.", "notes": ["Connectives: <i>et, mais<\/i>", "Intensifiers: <i>assez, très, quelquefois<\/i>", "A negative: <i>elle n'est pas bavarde<\/i>", "An opinion with a reason: <i>parce qu'elle est sympa<\/i>"]}, {"k": "h", "t": "Reading aloud: the sounds of French"}, {"k": "p", "t": "Learn these and you can read French words out loud with confidence."}, {"k": "sounds", "rows": [["final consonants", "usually silent", "grand, petit, les"], ["-ent on a verb", "silent", "ils jouent"], ["ou", "\"oo\"", "rouge, nous"], ["u", "say \"ee\" with rounded lips", "tu, une"], ["oi", "\"wa\"", "moi, trois"], ["eau / au", "\"oh\"", "beau, au revoir"], ["é", "\"ay\"", "café, été"], ["è / ê", "\"eh\"", "mère, être"], ["ç", "\"s\"", "ça, français"], ["qu", "\"k\"", "quinze, qui"], ["an / en", "nasal \"on\", through your nose", "grand, enfant"], ["in / ain", "nasal \"an\"", "cinq, demain"], ["on", "nasal \"on\"", "bon, mon"], ["gn", "\"ny\", as in canyon", "Espagne, montagne"], ["h", "silent", "habiter, hôtel"]]}, {"k": "h", "t": "Listen and write"}, {"k": "p", "t": "Tap play, write what you hear, then check. Accents count!"}, {"k": "dict", "items": ["Je m'appelle Léa.", "J'ai douze ans.", "J'ai les cheveux longs.", "Mon frère est grand.", "Mon anniversaire, c'est en juillet."]}], "quiz": [{"q": "What does <i>J'ai douze ans<\/i> mean?", "a": "I am 12 years old", "w": ["I have 12 brothers", "My birthday is on the 12th", "I live at number 12"], "why": "French uses <i>avoir<\/i> (to have) for age."}, {"q": "A girl wants to say \"I am tall\". Which is right?", "a": "Je suis grande.", "w": ["Je suis grand.", "J'ai grande.", "Elle est grande."], "why": "A girl adds -e. <i>Je suis<\/i> = I am."}, {"q": "J'ai les yeux ___ (blue eyes)", "a": "bleus", "w": ["bleu", "bleues", "bleue"], "why": "<i>Les yeux<\/i> is masculine plural, so add -s."}, {"q": "How do you say \"my parents\"?", "a": "mes parents", "w": ["mon parents", "ma parents", "mes parent"], "why": "Plural, so <i>mes<\/i>."}, {"q": "Which word means \"lazy\"?", "a": "paresseux", "w": ["drôle", "bavard", "sympa"], "why": "<i>drôle<\/i> = funny, <i>bavard<\/i> = chatty, <i>sympa<\/i> = nice."}, {"q": "How do you say \"I don't have a sister\"?", "a": "Je n'ai pas de sœur.", "w": ["Je n'ai pas une sœur.", "Je ne pas ai de sœur.", "Je n'ai sœur pas."], "why": "<i>ne … pas<\/i> around the verb, and <i>une<\/i> becomes <i>de<\/i>."}, {"q": "What month is <i>juillet<\/i>?", "a": "July", "w": ["June", "January", "April"], "why": "<i>juin<\/i> is June. No capital letters for months in French."}, {"q": "How do you write 15 in French?", "a": "quinze", "w": ["cinq", "quatorze", "cinquante"], "why": "<i>cinq<\/i> = 5, <i>quatorze<\/i> = 14, <i>cinquante<\/i> = 50."}, {"q": "Someone asks <i>Comment tu t'appelles ?<\/i> Which answer fits?", "a": "Je m'appelle Sam.", "w": ["J'ai douze ans.", "Je suis sympa.", "Ça va bien."], "why": "Use the question: <i>tu t'appelles<\/i> → <i>je m'appelle<\/i>."}, {"q": "<i>être<\/i>: \"we are\" is…", "a": "nous sommes", "w": ["nous avons", "nous êtes", "nous sont"], "why": "<i>nous avons<\/i> = we have."}, {"q": "Why is it <i>ma sœur<\/i>, not <i>mon sœur<\/i>?", "a": "<i>sœur<\/i> is a feminine word", "w": ["<i>sœur<\/i> is plural", "Only girls say <i>ma<\/i>", "It's a spelling rule before s"], "why": "\"My\" matches the thing, not the person speaking."}, {"q": "What does <i>Je m'entends bien avec mon père<\/i> mean?", "a": "I get on well with my dad", "w": ["I hear my dad well", "I'm called the same as my dad", "I wait for my dad"], "why": "<i>s'entendre bien avec<\/i> = to get on well with."}]}, "8": {"stage": "Key Stage 3 · Autumn Assessment", "examFacts": [["4 short exams", "Listening, Reading and Grammar, plus Writing <i>or<\/i> Speaking."], ["15 minutes", "each for Listening, Reading and Grammar."], ["25 minutes", "for Writing. Or a 5-minute Speaking exam, with 5 minutes to prepare."], ["1 pen", "All you need to bring."]], "examNote": "Year 8 exams run from Monday 30 November to Friday 11 December 2026. Your teacher will tell you whether you do the Writing exam or the Speaking exam.", "topics": [{"h": "Listening and Reading", "items": ["Places in town", "Activities in town", "School", "Family members", "Opinions"]}, {"h": "Writing", "items": ["A vocabulary quiz", "Translating key phrases from English", "Writing about where you live, what your town is like, where you go at the weekend, and your plans for next weekend"]}, {"h": "Speaking", "items": ["Reading aloud", "Conversation: where you live, what your town is like, where you go at the weekend, and your plans for next weekend"]}, {"h": "Grammar", "items": ["Key verbs: <i>aller, faire, jouer<\/i>", "The near future: <i>je vais<\/i> + infinitive", "Different ways to say \"in\" and \"to\": <i>à, au, en, aux, dans<\/i>", "Structures followed by an infinitive: <i>j'aime, on peut<\/i>"]}], "alsoKnow": "Also know your core words: connectives, intensifiers, opinions, and the present and future tenses.", "prepare": ["Look back through your exercise book at the tasks and questions from your lessons.", "Missed a lesson? Ask your teacher, or someone in your class, what you missed and catch up.", "Learn the phrases in the <a href=\"#rev\">Revision<\/a> tab, then test yourself in the <a href=\"#flash\">Flashcards<\/a>.", "Check the rules in the <a href=\"#gram\">Grammar<\/a> tab, then do the <a href=\"#quiz\">Quiz<\/a>.", "Practise your speaking out loud with a friend or someone at home. Tap 🔊 to hear how the French sounds.", "Write key words out several times to learn the spelling."], "links": [["BBC Bitesize KS3 French", "https://www.bbc.co.uk/bitesize/subjects/zgdqxnb"], ["Oak National Academy: Key Stage 3 French", "https://www.thenational.academy/teachers/programmes/french-secondary-ks3-l/units"], ["Harris Quizlet: Year 8 French", "https://tinyurl.com/Y08FRENCH"]], "top": ["<b>Start sentences with a time phrase:<\/b> <i>Le week-end…, Quand il fait beau…, Le week-end prochain…<\/i>", "<b>Give opinions with reasons:<\/b> <i>J'aime ma ville parce que c'est animé.<\/i>", "<b>Use two tenses:<\/b> the present (<i>je vais au parc<\/i>) and the near future (<i>je vais aller au cinéma<\/i>).", "<b>Get \"to the\" right:<\/b> <i>au parc, à la piscine, aux magasins<\/i>.", "<b>After <i>on peut<\/i> and <i>j'aime<\/i><\/b>, use the infinitive: <i>on peut nager<\/i>."], "rev": [{"t": "Places in town", "e": "🏙️", "rows": [["J'habite à Londres", "I live in London"], ["Dans ma ville, il y a…", "In my town there is / there are…"], ["un parc", "a park"], ["une piscine", "a swimming pool"], ["un centre sportif", "a sports centre"], ["un centre commercial", "a shopping centre"], ["un cinéma", "a cinema"], ["une bibliothèque", "a library"], ["un marché", "a market"], ["un musée", "a museum"], ["une gare", "a train station"], ["beaucoup de magasins", "lots of shops"], ["Il n'y a pas de stade", "There isn't a stadium"]]}, {"t": "Opinions about my town", "e": "👍", "rows": [["J'aime ma ville parce que…", "I like my town because…"], ["C'est animé", "It's lively"], ["C'est calme", "It's quiet"], ["C'est joli", "It's pretty"], ["C'est bruyant", "It's noisy"], ["C'est sale", "It's dirty"], ["Il y a trop de circulation", "There is too much traffic"], ["Il y a beaucoup de choses à faire", "There are lots of things to do"], ["Il n'y a rien à faire", "There's nothing to do"]]}, {"t": "At the weekend", "e": "🎳", "rows": [["Le week-end…", "At the weekend…"], ["Je vais au parc", "I go to the park"], ["Je vais à la piscine", "I go to the swimming pool"], ["Je vais aux magasins", "I go to the shops"], ["Je fais du shopping", "I go shopping"], ["Je joue au foot", "I play football"], ["Je fais du vélo", "I go cycling"], ["Quand il fait beau…", "When the weather is nice…"], ["Quand il pleut…", "When it rains…"], ["On peut aller au cinéma", "You can go to the cinema"], ["J'aime retrouver mes amis", "I like meeting up with my friends"]]}, {"t": "Next weekend", "e": "📅", "rows": [["Le week-end prochain…", "Next weekend…"], ["Samedi", "On Saturday"], ["Je vais aller au cinéma", "I am going to go to the cinema"], ["Je vais jouer au basket", "I am going to play basketball"], ["On va manger au restaurant", "We are going to eat at a restaurant"], ["Ça va être génial", "It's going to be great"], ["Ensuite", "Then"], ["Le soir", "In the evening"]]}, {"t": "School", "e": "🏫", "rows": [["Ma matière préférée, c'est l'anglais", "My favourite subject is English"], ["J'aime les sciences", "I like science"], ["J'adore le dessin", "I love art"], ["Je n'aime pas les maths", "I don't like maths"], ["Je déteste l'histoire", "I hate history"], ["parce que c'est intéressant", "because it's interesting"], ["parce que c'est ennuyeux", "because it's boring"], ["parce que c'est facile / difficile", "because it's easy / difficult"], ["Le prof est sympa", "The teacher is nice"]]}, {"t": "Family members", "e": "👪", "rows": [["Mon frère s'appelle Tom", "My brother is called Tom"], ["Ma sœur a quatorze ans", "My sister is 14"], ["Mon père est drôle", "My dad is funny"], ["Mes grands-parents habitent en France", "My grandparents live in France"]]}], "gram": [{"t": "Key verbs in the present", "p": "Learn these three: you use them all the time.", "table": {"head": ["", "aller (to go)", "faire (to do)", "jouer (to play)"], "rows": [["je", "vais", "fais", "joue"], ["tu", "vas", "fais", "joues"], ["il / elle / on", "va", "fait", "joue"], ["nous", "allons", "faisons", "jouons"], ["vous", "allez", "faites", "jouez"], ["ils / elles", "vont", "font", "jouent"]]}}, {"t": "The near future: going to", "p": "<b>aller<\/b> + an infinitive.", "ex": [["Je vais aller au cinéma.", "I am going to go to the cinema."], ["On va manger au restaurant.", "We are going to eat at a restaurant."], ["Ça va être génial !", "It's going to be great!"]]}, {"t": "Ways to say \"in\" and \"to\"", "p": "The little word changes with the place.", "table": {"head": ["Word", "Use it with", "Example"], "rows": [["à", "towns and cities", "à Londres, à Paris"], ["en", "feminine countries", "en France, en Espagne"], ["au", "masculine countries", "au Portugal, au Canada"], ["aux", "plural countries", "aux États-Unis"], ["dans", "inside a place", "dans ma ville, dans ma chambre"]]}, "tip": "\"To the\": <b>à + le = au<\/b> (<i>au parc<\/i>), <b>à + la<\/b> stays (<i>à la piscine<\/i>), <b>à + les = aux<\/b> (<i>aux magasins<\/i>)."}, {"t": "Structures + infinitive", "p": "After these, the next verb stays in the infinitive (-er, -ir, -re).", "table": {"head": ["Structure", "Meaning", "Example"], "rows": [["j'aime", "I like", "J'aime nager."], ["j'adore", "I love", "J'adore jouer au foot."], ["je préfère", "I prefer", "Je préfère lire."], ["on peut", "you can", "On peut aller au cinéma."], ["je voudrais", "I would like", "Je voudrais visiter Paris."]]}}, {"t": "il y a and il n'y a pas de", "p": "<b>il y a<\/b> = there is / there are. <b>il n'y a pas de<\/b> = there isn't / aren't any.", "ex": [["Il y a un parc.", "There is a park."], ["Il n'y a pas de piscine.", "There isn't a swimming pool."]]}], "skills": [{"k": "h", "t": "Your speaking or writing task"}, {"k": "p", "t": "Talk or write about where you live, what your town is like, where you go at the weekend, and your plans for next weekend."}, {"k": "model", "t": "Model answer", "text": "J'habite à Peckham, dans le sud-est de Londres. Dans ma ville, il y a un parc, une bibliothèque et beaucoup de magasins, mais il n'y a pas de piscine. J'aime ma ville parce que c'est animé, mais c'est assez bruyant. Le week-end, je vais au parc avec mes amis et on joue au foot. Quand il pleut, je vais au cinéma. Le week-end prochain, je vais aller au centre commercial avec ma sœur. On va acheter des vêtements et ensuite on va manger une pizza. Ça va être génial !", "en": "I live in Peckham, in south-east London. In my town there is a park, a library and lots of shops, but there isn't a swimming pool. I like my town because it's lively, but it's quite noisy. At the weekend I go to the park with my friends and we play football. When it rains, I go to the cinema. Next weekend I'm going to go to the shopping centre with my sister. We're going to buy clothes and then we're going to eat a pizza. It's going to be great!", "notes": ["<i>il y a / il n'y a pas de<\/i>", "Opinion + reason", "<i>au parc, au cinéma<\/i>", "Near future: <i>je vais aller, on va acheter<\/i>"]}, {"k": "h", "t": "Reading aloud: the sounds of French"}, {"k": "sounds", "rows": [["final consonants", "usually silent", "grand, petit, les"], ["-ent on a verb", "silent", "ils jouent"], ["ou", "\"oo\"", "rouge, nous"], ["u", "say \"ee\" with rounded lips", "tu, une"], ["oi", "\"wa\"", "moi, trois"], ["eau / au", "\"oh\"", "beau, au revoir"], ["é", "\"ay\"", "café, été"], ["è / ê", "\"eh\"", "mère, être"], ["ç", "\"s\"", "ça, français"], ["qu", "\"k\"", "quinze, qui"], ["an / en", "nasal \"on\", through your nose", "grand, enfant"], ["in / ain", "nasal \"an\"", "cinq, demain"], ["on", "nasal \"on\"", "bon, mon"], ["gn", "\"ny\", as in canyon", "Espagne, montagne"], ["h", "silent", "habiter, hôtel"]]}, {"k": "h", "t": "Listen and write"}, {"k": "p", "t": "Tap play, write what you hear, then check. Accents count!"}, {"k": "dict", "items": ["Dans ma ville, il y a un parc.", "C'est animé mais bruyant.", "Le week-end, je vais à la piscine.", "Samedi, je vais jouer au foot.", "Ma matière préférée, c'est le dessin."]}], "quiz": [{"q": "Je vais ___ cinéma.", "a": "au", "w": ["à la", "aux", "en"], "why": "<i>le cinéma<\/i>: à + le = au."}, {"q": "How do you say \"There isn't a swimming pool\"?", "a": "Il n'y a pas de piscine.", "w": ["Il n'y a pas une piscine.", "Il y a pas piscine.", "Il ne y a pas de piscine."], "why": "After a negative, <i>une<\/i> becomes <i>de<\/i>."}, {"q": "\"I am going to play\" is…", "a": "Je vais jouer", "w": ["Je vais joue", "Je jouer vais", "Je va jouer"], "why": "<i>aller<\/i> + infinitive."}, {"q": "What does <i>C'est bruyant<\/i> mean?", "a": "It's noisy", "w": ["It's brown", "It's quiet", "It's busy"], "why": "<i>calme<\/i> = quiet."}, {"q": "\"in London\" is…", "a": "à Londres", "w": ["en Londres", "au Londres", "dans Londres"], "why": "Towns and cities take <i>à<\/i>."}, {"q": "\"in France\" is…", "a": "en France", "w": ["à France", "au France", "aux France"], "why": "<i>la France<\/i> is feminine, so <i>en<\/i>."}, {"q": "On peut ___ au parc.", "a": "aller", "w": ["va", "allons", "vais"], "why": "<i>on peut<\/i> + infinitive."}, {"q": "<i>aller<\/i>: \"they go\" is…", "a": "ils vont", "w": ["ils allent", "ils vas", "ils allons"], "why": "<i>aller<\/i> is irregular."}, {"q": "What is <i>une bibliothèque<\/i>?", "a": "A library", "w": ["A bookshop", "A bible", "A bakery"], "why": "A bookshop is <i>une librairie<\/i>."}, {"q": "What does <i>Je n'aime pas les maths parce que c'est ennuyeux<\/i> mean?", "a": "I don't like maths because it's boring", "w": ["I don't like maths because it's easy", "I love maths because it's annoying", "I don't like maths because the teacher is boring"], "why": "<i>ennuyeux<\/i> = boring."}, {"q": "What does <i>Ça va être génial<\/i> mean?", "a": "It's going to be great", "w": ["It was great", "It's great", "It would be great"], "why": "<i>va<\/i> + <i>être<\/i> = near future."}, {"q": "<i>faire<\/i>: \"I do\" is…", "a": "je fais", "w": ["je fait", "je fai", "je faire"], "why": "<i>il fait<\/i> ends in -t; <i>je fais<\/i> ends in -s."}]}, "9": {"stage": "Key Stage 3 · Autumn Assessment", "examFacts": [["4 short exams", "Listening, Reading and Grammar, plus Writing <i>or<\/i> Speaking."], ["15 minutes", "each for Listening, Reading and Grammar."], ["25 minutes", "for Writing. Or a 5-minute Speaking exam, with 5 minutes to prepare."], ["1 pen", "All you need to bring."]], "examNote": "Your teacher will tell you whether you do the Writing exam or the Speaking exam, and the dates of your exams.", "topics": [{"h": "Listening and Reading", "items": ["Introducing yourself", "Family", "Best friend", "Childhood", "Shopping", "Weekend activities (from Year 8)"]}, {"h": "Writing", "items": ["A vocabulary quiz", "Translating key phrases from English", "Writing about yourself, your best friend, what you were like when you were younger, what you can do to stand up to violence, and things you did in the past"]}, {"h": "Speaking", "items": ["Reading aloud", "Conversation based on a photo card: friends and best friend, family"]}, {"h": "Grammar", "items": ["Present tense of regular -er verbs, and the reflexive verbs <i>s'entendre<\/i> and <i>s'appeler<\/i> (je, tu, il / elle / on)", "Key verbs in the imperfect tense", "Structures followed by an infinitive", "Adjective agreement", "The near future (from Year 8)"]}], "alsoKnow": "Also know your core words (connectives, intensifiers, opinions) and the present and future tenses.", "prepare": ["Look back through your exercise book at the tasks and questions from your lessons.", "Missed a lesson? Ask your teacher, or someone in your class, what you missed and catch up.", "Learn the phrases in the <a href=\"#rev\">Revision<\/a> tab, then test yourself in the <a href=\"#flash\">Flashcards<\/a>.", "Check the rules in the <a href=\"#gram\">Grammar<\/a> tab, then do the <a href=\"#quiz\">Quiz<\/a>.", "Practise your speaking out loud with a friend or someone at home. Tap 🔊 to hear how the French sounds.", "Write key words out several times to learn the spelling."], "links": [["BBC Bitesize KS3 French", "https://www.bbc.co.uk/bitesize/subjects/zgdqxnb"], ["Oak National Academy: Key Stage 3 French", "https://www.thenational.academy/teachers/programmes/french-secondary-ks3-l/units"], ["Harris Quizlet: Year 9 French", "https://quizlet.com/user/HFLanguages/folders/y09fr_autumn"]], "top": ["<b>Use the imperfect to describe the past:<\/b> <i>Quand j'étais petit, j'étais timide.<\/i>", "<b>Use three timeframes:<\/b> present (<i>je m'entends bien…<\/i>), past (<i>j'ai acheté…<\/i>) and future (<i>je vais…<\/i>).", "<b>Describe your friend with agreeing adjectives:<\/b> <i>Ma meilleure amie est généreuse.<\/i>", "<b>In the photo, say who, where and what:<\/b> <i>Sur la photo, il y a trois amis. Ils sont dans un parc.<\/i>", "<b>Give reasons:<\/b> <i>Je m'entends bien avec elle parce qu'elle est drôle.<\/i>"], "rev": [{"t": "Me and my family", "e": "👪", "rows": [["Je m'appelle Sam et j'ai treize ans", "My name is Sam and I'm 13"], ["J'habite avec ma mère et mon beau-père", "I live with my mum and my stepdad"], ["Je m'entends bien avec ma sœur", "I get on well with my sister"], ["Je m'entends mal avec mon frère", "I get on badly with my brother"], ["Je me dispute avec mes parents", "I argue with my parents"], ["Ma mère est compréhensive", "My mum is understanding"], ["Mon père est trop strict", "My dad is too strict"]]}, {"t": "My best friend", "e": "🤝", "rows": [["Mon meilleur ami s'appelle…", "My best fr
